# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: Lemuel Gebreselassie
description: "Software engineer moving into data engineering, with a Master of Data Science from the University of Pittsburgh. This portfolio features an incremental S3, DuckDB and Airflow pipeline with Terraform-managed IAM, and an analysis of POGOH bike-share ridership. Find my work on GitHub and LinkedIn, or download my resume using the links below."
baseurl: ""  # leave empty if the repo is named <username>.github.io; otherwise "/<repo-name>"
url: "https://lemuelhmgs12.github.io"

#-------------------------------
# About Section
subtitle: Data Engineering <span style="color:#f58506"> Portfolio </span>
location: "Pittsburgh, PA"
resume_url: /docs/xxx.pdf
avatar_image: /img/profile_picture.png

#-------------------------------
# Contact links
linkedln: "https://www.linkedin.com/in/lemuel-gebreselassie-28305080/"
github: "https://github.com/lemuelhmgs12"
paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


