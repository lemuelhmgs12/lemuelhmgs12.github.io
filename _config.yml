# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: Lemuel Gebreselassie
description: "I'm a software engineer with a background in application development and quality assurance, and a Master of Data Science from the University of Pittsburgh. I'm building a career in data engineering, where I bring an engineer's discipline around testing, reliability and clear documentation to data work. Browse my projects below, or use the links to reach my GitHub, LinkedIn and resume." 
url: "https://lemuelhmgs12.github.io"

#-------------------------------
# About Section
subtitle: Data Engineering <span style="color:#f58506"> Portfolio </span>
location: "Corona, CA"
resume_url: /docs/xxx.pdf
avatar_image: /img/profile_picture.png

#-------------------------------
# Contact links
linkedln: "https://www.linkedin.com/in/lemuel-gebreselassie-28305080/"
github: "https://github.com/lemuelhmgs12"
paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


